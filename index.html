<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#121222"><title>Hell Wars — Claim your underworld</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game">
<section class="territory-hud"><div class="territory-label"><span>FULL WORLD TERRITORY</span><strong id="territoryText">0.0%</strong></div><div id="territoryBar" role="progressbar" aria-label="Your percentage of the full world" aria-valuemin="0" aria-valuemax="100"><div id="territoryFill"></div><div id="rivalFill"></div></div></section>
<section class="scoreboard"><div class="team red"><small>YOU</small><strong id="score0">0.0<span>%</span></strong><div id="lives0" class="hearts" aria-label="Your lives"></div><div class="npc-score"><span id="bonus0">0</span> BONUS</div></div><div class="clock"><strong id="timer">3:00</strong><button id="sound" aria-label="Toggle sound" title="Toggle sound">♪</button></div><div class="team blue"><small>AI</small><strong id="score1">0.0<span>%</span></strong><div id="lives1" class="hearts" aria-label="AI lives"></div><div class="npc-score"><span id="bonus1">0</span> BONUS</div></div></section>
<div id="arena"><canvas id="world" aria-label="3D territory capture arena"></canvas><canvas id="minimap" width="112" height="112" aria-label="Full world map showing territory and your position"></canvas><div id="toast" role="status"></div><div id="joystick"><i></i></div></div>
<footer><div class="ink-label"><span>INK <b id="levelLabel">LV 1</b></span><strong id="inkText">100 / 100</strong></div><div class="ink-track"><div id="inkFill"></div></div><div class="growth"><div class="xp-track" role="progressbar" aria-label="Capture new territory to level up" aria-valuemin="0" aria-valuemax="100"><div id="xpFill"></div></div><span id="nextLevel">LV 2</span></div></footer>
<div id="overlay"><div class="modal"><h1>HELL <em>WARS</em></h1><p>Capture land. Level up. Grow your ink.<br>WASD, arrows, or drag to fly.</p><button id="start" class="primary">PLAY</button></div></div>
</main><script src="vendor/three.min.js"></script><script src="core.js"></script><script src="game.js"></script></body></html>
